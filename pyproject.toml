[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scraping-ibge"
version = "1.1.0"
description = "Coleta séries históricas municipais na API oficial do IBGE e publica em CSV, JSON e um dashboard HTML autônomo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thiagobessaphd" }]
keywords = ["ibge", "api", "serie-historica", "dashboard", "csv"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scraping-ibge = "scraping_ibge_municipios:main"

[tool.setuptools]
py-modules = ["scraping_ibge_municipios", "dashboard_generator"]

[tool.setuptools.package-data]
scraping-ibge = ["dashboards/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"