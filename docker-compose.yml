services:
  scraper-ibge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraper-ibge-municipios
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./resultados_ibge:/app/resultados_ibge
      - ./dashboards:/app/dashboards
    restart: "no"
